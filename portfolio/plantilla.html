<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio · Malackath</title>
<meta name="description" content="Marcas, apps y sitios diseñados por Malackath, estudio de diseño y producto digital.">
<meta property="og:title" content="Portfolio · Malackath">
<meta property="og:description" content="Marcas, apps y sitios diseñados por Malackath.">
<meta property="og:type" content="website">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#131315;--panel:#1B1B1E;--panel2:#232327;--line:#2E2E33;--fg:#F1F1EC;--muted:#A3A39B;--dim:#6F6F69;--lima:#D4FF00;--claro:#F3F2EC;
--display:"Syne","Helvetica Neue",Arial,sans-serif;--texto:"DM Sans",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--texto);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
:focus-visible{outline:2px solid var(--lima);outline-offset:3px}
.ancho{max-width:1280px;margin:0 auto;padding:0 24px}
/* barra */
.barra{position:sticky;top:0;z-index:10;background:rgba(19,19,21,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.barra .ancho{display:flex;align-items:center;justify-content:space-between;height:72px}
.barra img{height:30px;width:auto}
.barra span{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* portada */
.portada{padding-top:88px;padding-bottom:56px}
.eyebrow{font:400 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lima);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lima)}
h1{font:800 clamp(44px,9vw,128px)/.9 var(--display);overflow-wrap:anywhere;letter-spacing:-.04em;margin:18px 0 22px}
.bajada{font-size:clamp(18px,2vw,22px);color:var(--muted);max-width:46ch;margin:0}
/* grilla de tarjetas */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:96px}
.tarjeta{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;transition:border-color .2s,transform .2s}
.tarjeta:hover{border-color:var(--lima);transform:translateY(-3px)}
.logo{position:relative;aspect-ratio:16/10;background:#0D0D0F;overflow:hidden}
.logo img{position:absolute;inset:14% 12%;width:76%;height:72%;object-fit:contain}
.logo.f-claro{background:var(--claro)}
.logo.f-lamina img{inset:0;width:100%;height:100%;object-fit:cover}
.info{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px}
.tipo{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lima)}
.tarjeta h3{overflow-wrap:anywhere;font:700 22px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.tarjeta p{margin:0;color:var(--muted);font-size:14.5px}
/* proyectos */
.proyecto{border-top:1px solid var(--line);padding:72px 0}
.cab{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;align-items:center;margin-bottom:36px}
.cab .logo{border-radius:14px;border:1px solid var(--line)}
.num{font:400 12px var(--mono);color:var(--dim);margin-right:14px}
.cab h2{font:800 clamp(28px,7.2vw,64px)/.95 var(--display);letter-spacing:-.03em;margin:10px 0 12px;overflow-wrap:anywhere}
.cab p{margin:0;font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:52ch}
/* selector claro / oscuro */
.temas{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:2px;margin-top:20px;padding:3px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.temas button{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;transition:background .2s,color .2s}
.temas button:hover{color:var(--fg)}
.temas button.on{background:var(--lima);color:#131315}
.sims[hidden]{display:none}
.logo-grupo{transition:background .3s}
.logo-grupo img{position:absolute;inset:22% 8%;width:84%;height:56%;object-fit:contain}
.firma{display:block;margin-top:10px;font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
/* visor tipo simulador */
.sims{display:flex;gap:40px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.sim{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.sim.compu{flex:1 1 560px;max-width:860px}
.sim.cel{flex:0 0 auto;width:min(300px,78vw)}
.sim.lam{flex:1 1 560px;max-width:860px}
.marco{position:relative;width:100%;background:#0A0A0B;border:1px solid #34343A;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.compu .marco{border-radius:14px;padding:0 0 0;overflow:hidden}
.barra-nav{height:30px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#1E1E22;border-bottom:1px solid #2E2E33}
.barra-nav i{width:10px;height:10px;border-radius:50%;background:#3A3A40}
.barra-nav i:first-child{background:#FF5F57}.barra-nav i:nth-child(2){background:#FEBC2E}.barra-nav i:nth-child(3){background:#28C840}
.cel .marco{border-radius:46px;padding:12px;border:2px solid #3A3A40;background:#0A0A0B}
.isla{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:26%;height:18px;border-radius:10px;background:#000;z-index:2}
.lam .marco{border-radius:14px;overflow:hidden}
.pantalla{position:relative;width:100%;overflow:hidden;background:#111;touch-action:pan-y}
.compu .pantalla{aspect-ratio:16/10}
.cel .pantalla{aspect-ratio:390/844;border-radius:34px}
.lam .pantalla{aspect-ratio:3/2}
.pantalla img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:top center;opacity:0;transition:opacity .35s ease}
.lam .pantalla img{object-fit:contain;background:#111}
.pantalla img.on{opacity:1}
.nav{display:flex;align-items:center;gap:14px}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px;cursor:pointer;transition:border-color .2s,color .2s}
.nav button:hover{border-color:var(--lima);color:var(--lima)}
.cuenta{font:400 12px var(--mono);color:var(--muted);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.puntos{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.puntos button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#3A3A40;cursor:pointer}
.puntos button.on{background:var(--lima);width:18px;border-radius:4px}
.sim figcaption{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
/* pie */
.pie{border-top:1px solid var(--line);padding:40px 0 56px}
.pie .ancho{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--dim);font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.arriba{color:var(--lima);text-decoration:none}
@media (max-width:760px){
 .ancho{padding:0 16px}
 .portada{padding-top:56px;padding-bottom:40px}
 .cab{grid-template-columns:minmax(0,1fr);gap:20px}
 .proyecto{padding:52px 0}
 .sims{gap:32px}
 .sim.compu,.sim.lam{flex-basis:100%}
 .barra .ancho{height:64px}.barra img{height:26px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tarjeta{transition:none}}
</style>
</head>
<body>
<nav class="barra"><div class="ancho"><a href="#top" aria-label="Malackath"><img src="img/logo.svg" alt="Malackath" width="160" height="30"></a><span>Portfolio</span></div></nav>
<main id="top">
<section class="portada ancho">
  <div class="eyebrow">Malackath · {{CANTIDAD}} proyectos</div>
  <h1>Portfolio</h1>
  <p class="bajada">Marcas, apps y sitios que diseñamos y construimos.</p>
</section>
<div class="grilla ancho">
{{TARJETAS}}
</div>
<div class="ancho">
{{SECCIONES}}
</div>
</main>
<footer class="pie"><div class="ancho"><span>© 2026 Malackath · Estudio de diseño y producto digital</span><a class="arriba" href="#top">Volver arriba ↑</a></div></footer>
<script>
document.querySelectorAll('.temas').forEach(function(g){
  var sec=g.closest('.proyecto');
  g.querySelectorAll('button').forEach(function(b){b.onclick=function(){
    g.querySelectorAll('button').forEach(function(x){var on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-pressed',on)});
    sec.querySelectorAll('.sims[data-tema]').forEach(function(s){s.hidden=s.dataset.tema!==b.dataset.tema});
    var t=sec.querySelector('.logo-grupo'); if(t&&b.dataset.logo){t.style.background=b.dataset.fondo; var im=t.querySelector('img'); im.src=b.dataset.logo; im.alt=b.textContent;}
  }});
});
document.querySelectorAll('.sim').forEach(function(sim){
  var imgs=[].slice.call(sim.querySelectorAll('.pantalla img')), puntos=[].slice.call(sim.querySelectorAll('.puntos button')),
      cuenta=sim.querySelector('.cuenta'), i=0, n=imgs.length;
  function cargar(k){var im=imgs[(k+n)%n]; if(im&&!im.src&&im.dataset.src) im.src=im.dataset.src;}
  function ir(k){i=(k+n)%n; imgs.forEach(function(im,j){im.classList.toggle('on',j===i)}); puntos.forEach(function(b,j){b.classList.toggle('on',j===i)});
    if(cuenta) cuenta.textContent=(i+1)+' / '+n; cargar(i); cargar(i+1); cargar(i-1);}
  var a=sim.querySelector('.ant'), s=sim.querySelector('.sig');
  if(a) a.onclick=function(){ir(i-1)}; if(s) s.onclick=function(){ir(i+1)};
  puntos.forEach(function(b,j){b.onclick=function(){ir(j)}});
  var x0=null, p=sim.querySelector('.pantalla');
  p.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  p.addEventListener('touchend',function(e){if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) ir(i+(dx<0?1:-1)); x0=null});
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){cargar(0);cargar(1);io.disconnect()}})},{rootMargin:'400px'});
  io.observe(sim);
});
</script>
</body>
</html>
